<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProjectFlow 360</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="loading"><div><div class="spinner"></div><p style="margin-top:12px">Opening ProjectFlow 360…</p>
    <noscript><p>ProjectFlow 360 needs JavaScript. Please enable it in your browser.</p></noscript></div></div>
  <script type="module">
    // Entry point: go to the workspace when signed in, otherwise to the sign-in page.
    import { initBackend } from './js/services/backend.js';
    import { establish } from './js/services/session.js';
    try {
      await initBackend();
      const s = await establish();
      location.replace(s.state === 'ok' ? 'dashboard.html' : 'login.html');
    } catch (e) {
      location.replace('login.html');
    }
  </script>
</body>
</html>
